# Post-quantum TLS terminator for the local Keycloak issuer.
#
# Keycloak (JDK 21 / Vert.x) cannot serve ML-DSA certificates, so it listens
# on plain HTTP bound to 127.0.0.1 only and this HAProxy process, sharing its
# network namespace, owns the issuer's TLS socket on :8443 with the PKI-issued
# ML-DSA-65 certificate, X25519MLKEM768 key exchange and ML-DSA signature
# schemes only. Tokens, JWKs and issuer metadata therefore only ever cross a
# container or host boundary inside a post-quantum TLS session; the loopback
# hop never leaves the namespace.
global
  log stdout format raw local0 info
  ssl-default-bind-options ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3
  ssl-default-bind-curves X25519MLKEM768
  ssl-default-bind-sigalgs mldsa65:mldsa87
  ssl-default-bind-client-sigalgs mldsa65:mldsa87
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

defaults
  mode http
  log global
  option httplog
  option dontlognull
  option http-server-close
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 10s

frontend issuer_ingress
  bind :8443 ssl crt /etc/quantum-bank/tls/keycloak-server.pem alpn http/1.1
  # Keycloak derives request security from the proxy headers (--proxy-headers
  # xforwarded) and its issuer from --hostname; a client cannot spoof them
  # because HAProxy overwrites them on every request.
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 8443
  http-request set-header X-Forwarded-Host keycloak:8443
  http-request set-header X-Forwarded-For %[src]
  default_backend keycloak_loopback

backend keycloak_loopback
  server keycloak 127.0.0.1:8080
