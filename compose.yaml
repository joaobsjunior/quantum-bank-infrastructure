name: quantum-bank-local

# Transport topology. Every socket that crosses a container or host boundary
# is TLS 1.3 authenticated by a PKI-issued certificate:
#
#   * strict hops (backend port, gateway egress, backend-client, JWKS fetches):
#     ML-DSA-65 identities under the ML-DSA-87 CA and X25519MLKEM768 only;
#   * app-facing listeners (issuer :8443, gateway :8080/:8443): dual identity,
#     ML-DSA-65 for post-quantum clients and ECDSA P-256 (compatibility chain,
#     ECDSA P-384 CA) for clients whose TLS stack cannot verify ML-DSA yet
#     (the Dart/BoringSSL mobile transport, browsers); X25519MLKEM768
#     preferred, X25519 accepted; RSA refused.
#   * Keycloak and both KrakenD listeners cannot speak ML-DSA themselves (JDK 21
#     JSSE and Go crypto/tls), so each one is paired with a HAProxy + OpenSSL 3.5
#     terminator that shares its network namespace (`network_mode: service:`).
#     The paired process listens on 127.0.0.1 only; loopback never leaves the
#     namespace.
#   * The Spring Boot backend and backend-client run BouncyCastle's BCJSSE, which
#     negotiates ML-DSA and ML-KEM natively in-process.
#
# Host port bindings default to the loopback interface so the local runtime is
# never exposed on the LAN by accident. Set BIND_ADDRESS=0.0.0.0 to reach it from
# a physical device on the same network.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    # Production mode behind the post-quantum terminator: plain HTTP is bound to
    # the loopback interface only, so the issuer is reachable from the network
    # exclusively through keycloak-tls on :8443. The embedded dev-file database
    # keeps the local runtime self-contained.
    command: start --import-realm
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8180:8443"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD for local Keycloak}
      KC_HOSTNAME: https://keycloak:8443
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "false"
      KC_METRICS_ENABLED: "false"
      KC_DB: dev-file
      QUANTUM_BANK_TEST_CLIENT_SECRET: ${KEYCLOAK_TEST_CLIENT_SECRET:?set KEYCLOAK_TEST_CLIENT_SECRET}
      QUANTUM_BANK_BACKEND_CLIENT_SECRET: ${BACKEND_CLIENT_CLIENT_SECRET:?set BACKEND_CLIENT_CLIENT_SECRET}
      QUANTUM_BANK_SMOKE_PASSWORD: ${KEYCLOAK_SMOKE_PASSWORD:?set KEYCLOAK_SMOKE_PASSWORD}
    volumes:
      - ./keycloak/quantum-bank-local-realm.json:/opt/keycloak/data/import/quantum-bank-local-realm.json:ro

  keycloak-tls:
    image: ${GATEWAY_TLS_IMAGE:-quantum-bank-api-gateway-tls:local}
    build:
      context: ../api-gateway
      dockerfile: Dockerfile.tls
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    # HAProxy runs as uid 99; the PKI_GID group lets it read the group-readable
    # runtime PEM bundle without root.
    user: "99:${PKI_GID:-0}"
    command: haproxy -f /etc/quantum-bank/haproxy/haproxy-keycloak.cfg
    volumes:
      - ./keycloak/haproxy-keycloak.cfg:/etc/quantum-bank/haproxy/haproxy-keycloak.cfg:ro
      - ../pki/local-ca/runtime:/etc/quantum-bank/tls:ro

  backend:
    image: ${BACKEND_IMAGE:-quantum-bank-backend:local}
    build:
      context: ../backend
    depends_on:
      - keycloak
      - keycloak-tls
    expose:
      - "8080"
    # Supplementary group that owns pki/local-ca/private on the host so the
    # non-root backend user can read the issuing key for the local sign script.
    group_add:
      - "${PKI_GID:-0}"
    environment:
      QUANTUM_BANK_BACKEND_SSL_ENABLED: "true"
      QUANTUM_BANK_BACKEND_KEY_STORE: /etc/quantum-bank/runtime/backend-server.p12
      QUANTUM_BANK_BACKEND_KEY_STORE_PASSWORD: ${BACKEND_SERVER_KEY_STORE_PASSWORD:-changeit}
      QUANTUM_BANK_BACKEND_TRUST_STORE: /etc/quantum-bank/runtime/backend-truststore.p12
      QUANTUM_BANK_BACKEND_TRUST_STORE_PASSWORD: ${BACKEND_TRUST_STORE_PASSWORD:-changeit}
      QUANTUM_BANK_ISSUER_URI: https://keycloak:8443/realms/quantum-bank-local
      QUANTUM_BANK_JWK_SET_URI: https://keycloak:8443/realms/quantum-bank-local/protocol/openid-connect/certs
      # Outbound TLS (JWK fetch) trusts only the local PKI anchors; the
      # post-quantum JSSE provider and ML-DSA/ML-KEM policy are installed by the
      # application itself before any socket is opened.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/etc/quantum-bank/runtime/backend-truststore.p12
        -Djavax.net.ssl.trustStorePassword=${BACKEND_TRUST_STORE_PASSWORD:-changeit}
        -Djavax.net.ssl.trustStoreType=PKCS12
      # Gateway-only transport guard: only the gateway terminator's client certificate may reach the backend.
      QUANTUM_BANK_MTLS_ENFORCE_GATEWAY_IDENTITY: "true"
      QUANTUM_BANK_MTLS_ALLOWED_CLIENT_NAMES: gateway-client
      QUANTUM_BANK_PKI_SIGN_COMMAND: /workspace/pki/scripts/sign-csr.sh
      QUANTUM_BANK_PKI_ISSUING_CERT: /workspace/pki/local-ca/trust/issuing-ca.crt
      QUANTUM_BANK_DATASOURCE_URL: jdbc:h2:mem:quantumbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - ../pki/local-ca/runtime:/etc/quantum-bank/runtime:ro
      # Only what the sign script needs, and read-only wherever possible: a
      # compromised backend cannot alter the scripts, profiles, or CA keys.
      - ../pki/scripts:/workspace/pki/scripts:ro
      - ../pki/local-ca/profiles:/workspace/pki/local-ca/profiles:ro
      - ../pki/local-ca/private:/workspace/pki/local-ca/private:ro
      - ../pki/local-ca/trust:/workspace/pki/local-ca/trust:ro

  gateway-bootstrap:
    image: ${GATEWAY_IMAGE:-quantum-bank-api-gateway:local}
    build:
      context: ../api-gateway
    # KrakenD binds 127.0.0.1:18080 only; the published port is served by the
    # gateway-bootstrap-tls terminator inside this network namespace.
    command: run -c /etc/krakend/krakend-bootstrap.json
    depends_on:
      - backend
      - keycloak
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_BOOTSTRAP_PORT:-8080}:8080"

  gateway-bootstrap-tls:
    image: ${GATEWAY_TLS_IMAGE:-quantum-bank-api-gateway-tls:local}
    build:
      context: ../api-gateway
      dockerfile: Dockerfile.tls
    network_mode: "service:gateway-bootstrap"
    depends_on:
      - gateway-bootstrap
    user: "99:${PKI_GID:-0}"
    command: haproxy -f /usr/local/etc/haproxy/haproxy-bootstrap.cfg
    volumes:
      - ../pki/local-ca/runtime:/etc/quantum-bank/tls:ro

  gateway-banking:
    image: ${GATEWAY_IMAGE:-quantum-bank-api-gateway:local}
    build:
      context: ../api-gateway
    # KrakenD binds 127.0.0.1:18443 only; app-to-gateway mTLS is enforced by
    # the gateway-banking-tls terminator inside this network namespace.
    command: run -c /etc/krakend/krakend-banking.json
    depends_on:
      - backend
      - keycloak
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_BANKING_PORT:-8443}:8443"

  gateway-banking-tls:
    image: ${GATEWAY_TLS_IMAGE:-quantum-bank-api-gateway-tls:local}
    build:
      context: ../api-gateway
      dockerfile: Dockerfile.tls
    network_mode: "service:gateway-banking"
    depends_on:
      - gateway-banking
    user: "99:${PKI_GID:-0}"
    command: haproxy -f /usr/local/etc/haproxy/haproxy-banking.cfg
    volumes:
      - ../pki/local-ca/runtime:/etc/quantum-bank/tls:ro

  backend-client:
    image: ${BACKEND_CLIENT_IMAGE:-quantum-bank-backend-client:local}
    build:
      context: ../backend-client
    depends_on:
      - gateway-banking
      - gateway-banking-tls
      - keycloak-tls
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_CLIENT_PORT:-8090}:8080"
    environment:
      QUANTUM_BANK_CLIENT_GATEWAY_BASE_URL: https://gateway-banking:8443
      QUANTUM_BANK_CLIENT_TOKEN_URI: https://keycloak:8443/realms/quantum-bank-local/protocol/openid-connect/token
      QUANTUM_BANK_CLIENT_ID: ${BACKEND_CLIENT_CLIENT_ID:-quantum-bank-backend-client}
      QUANTUM_BANK_CLIENT_SECRET: ${BACKEND_CLIENT_CLIENT_SECRET:?set BACKEND_CLIENT_CLIENT_SECRET}
      QUANTUM_BANK_CLIENT_SCOPE: ${BACKEND_CLIENT_SCOPE:-pix:write statements:read profile:read}
      QUANTUM_BANK_CLIENT_KEY_STORE: /etc/quantum-bank/runtime/backend-client.p12
      QUANTUM_BANK_CLIENT_KEY_STORE_PASSWORD: ${BACKEND_CLIENT_KEY_STORE_PASSWORD:-changeit}
      QUANTUM_BANK_CLIENT_TRUST_STORE: /etc/quantum-bank/runtime/backend-client-truststore.p12
      QUANTUM_BANK_CLIENT_TRUST_STORE_PASSWORD: ${BACKEND_CLIENT_TRUST_STORE_PASSWORD:-changeit}
      QUANTUM_BANK_CONSOLE_USERNAME: ${BACKEND_CLIENT_CONSOLE_USERNAME:?set BACKEND_CLIENT_CONSOLE_USERNAME}
      QUANTUM_BANK_CONSOLE_PASSWORD: ${BACKEND_CLIENT_CONSOLE_PASSWORD:?set BACKEND_CLIENT_CONSOLE_PASSWORD}
    volumes:
      - ../pki/local-ca/runtime:/etc/quantum-bank/runtime:ro

  smoke-tests:
    # curl 8.16 links OpenSSL 3.5. It offers ECDSA schemes, so the app-facing
    # listeners serve it the ECDSA compatibility identity (verified against the
    # union of both root anchors) exactly like the Dart mobile transport sees
    # them, over X25519MLKEM768; the client certificates it presents come from
    # both chains (ML-DSA-65 and ECDSA P-256 mobile fixtures).
    image: curlimages/curl:8.16.0
    profiles:
      - smoke
    user: "0:0"
    depends_on:
      - gateway-bootstrap-tls
      - gateway-banking-tls
      - keycloak-tls
    environment:
      KEYCLOAK_TOKEN_URL: https://keycloak:8443/realms/quantum-bank-local/protocol/openid-connect/token
      KEYCLOAK_TEST_CLIENT_ID: ${KEYCLOAK_TEST_CLIENT_ID:-quantum-bank-test}
      KEYCLOAK_TEST_CLIENT_SECRET: ${KEYCLOAK_TEST_CLIENT_SECRET:?set KEYCLOAK_TEST_CLIENT_SECRET}
      KEYCLOAK_SMOKE_USERNAME: ${KEYCLOAK_SMOKE_USERNAME:-alice@quantumbank.local}
      KEYCLOAK_SMOKE_PASSWORD: ${KEYCLOAK_SMOKE_PASSWORD:?set KEYCLOAK_SMOKE_PASSWORD}
      KEYCLOAK_SMOKE_SUBJECT: ${KEYCLOAK_SMOKE_SUBJECT:-00000000-0000-0000-0000-000000000001}
      GATEWAY_BOOTSTRAP_URL: https://gateway-bootstrap:8080
      GATEWAY_BANKING_URL: https://gateway-banking:8443
      BACKEND_DIRECT_URL: https://backend:8080
      TRUST_ANCHOR: /etc/quantum-bank/runtime/trust-anchors.crt
      BACKEND_TRUST_ANCHOR: /etc/quantum-bank/runtime/root-ca.crt
      MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client.crt
      MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client.key
      COMPAT_MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client-compat.crt
      COMPAT_MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client-compat.key
      MOBILE_ENROLL_CSR: /etc/quantum-bank/runtime/mobile-smoke-enroll.csr
      COMPAT_MOBILE_ENROLL_CSR: /etc/quantum-bank/runtime/mobile-smoke-enroll-compat.csr
    volumes:
      - ./scripts/local-e2e-smoke.sh:/scripts/local-e2e-smoke.sh:ro
      - ../pki/local-ca/runtime:/etc/quantum-bank/runtime:ro
    entrypoint:
      - /bin/sh
      - /scripts/local-e2e-smoke.sh

  negative-mtls-tests:
    image: curlimages/curl:8.16.0
    profiles:
      - smoke
    user: "0:0"
    depends_on:
      - gateway-bootstrap-tls
      - gateway-banking-tls
      - backend
    environment:
      BANKING_URL: https://gateway-banking:8443/statements
      BOOTSTRAP_URL: https://gateway-bootstrap:8080/auth/otk
      BACKEND_URL: https://backend:8080/statements
      GATEWAY_CA_CERT: /etc/quantum-bank/runtime/trust-anchors.crt
      BACKEND_CA_CERT: /etc/quantum-bank/runtime/root-ca.crt
      MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client.crt
      MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client.key
      COMPAT_MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client-compat.crt
      COMPAT_MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client-compat.key
      UNTRUSTED_CLIENT_CERT: /etc/quantum-bank/negative/untrusted-client.crt
      UNTRUSTED_CLIENT_KEY: /etc/quantum-bank/negative/untrusted-client.key
      UNTRUSTED_COMPAT_CLIENT_CERT: /etc/quantum-bank/negative/untrusted-compat-client.crt
      UNTRUSTED_COMPAT_CLIENT_KEY: /etc/quantum-bank/negative/untrusted-compat-client.key
      EXPIRED_CLIENT_CERT: /etc/quantum-bank/negative/expired-client.crt
      EXPIRED_CLIENT_KEY: /etc/quantum-bank/negative/expired-client.key
      CLASSICAL_CLIENT_CERT: /etc/quantum-bank/negative/classical-client.crt
      CLASSICAL_CLIENT_KEY: /etc/quantum-bank/negative/classical-client.key
      MLDSA44_CLIENT_CERT: /etc/quantum-bank/negative/mldsa44-client.crt
      MLDSA44_CLIENT_KEY: /etc/quantum-bank/negative/mldsa44-client.key
      WRONG_ENVIRONMENT_CA_CERT: /etc/quantum-bank/negative/wrong-environment-ca.crt
    volumes:
      - ../pki/scripts/negative-mtls-tests.sh:/scripts/negative-mtls-tests.sh:ro
      - ../pki/local-ca/runtime:/etc/quantum-bank/runtime:ro
      - ../pki/local-ca/negative:/etc/quantum-bank/negative:ro
    entrypoint:
      - /bin/sh
      - /scripts/negative-mtls-tests.sh

  pqc-handshake-tests:
    # Handshake evidence: proves TLS 1.3 + X25519MLKEM768 + ML-DSA peer
    # signatures for post-quantum clients on every hop, the ECDSA
    # compatibility identity for compatibility clients on the app-facing
    # listeners, and that RSA (everywhere) and classical-only clients (strict
    # backend hop) are refused.
    image: ${PQC_OPENSSL_IMAGE:-alpine/openssl:3.5.8}
    profiles:
      - smoke
    user: "0:0"
    depends_on:
      - gateway-bootstrap-tls
      - gateway-banking-tls
      - keycloak-tls
      - backend
    environment:
      TRUST_ANCHOR: /etc/quantum-bank/runtime/root-ca.crt
      COMPAT_TRUST_ANCHOR: /etc/quantum-bank/runtime/root-ca-compat.crt
      ISSUER_TLS_ENDPOINT: keycloak:8443
      BOOTSTRAP_TLS_ENDPOINT: gateway-bootstrap:8080
      BANKING_TLS_ENDPOINT: gateway-banking:8443
      BACKEND_TLS_ENDPOINT: backend:8080
      MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client.crt
      MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client.key
      COMPAT_MOBILE_CLIENT_CERT: /etc/quantum-bank/runtime/mobile-smoke-client-compat.crt
      COMPAT_MOBILE_CLIENT_KEY: /etc/quantum-bank/runtime/mobile-smoke-client-compat.key
      GATEWAY_CLIENT_CERT: /etc/quantum-bank/runtime/gateway-client.crt
      GATEWAY_CLIENT_KEY: /etc/quantum-bank/runtime/gateway-client.key
    volumes:
      - ../pki/scripts/pqc-handshake-tests.sh:/scripts/pqc-handshake-tests.sh:ro
      - ../pki/local-ca/runtime:/etc/quantum-bank/runtime:ro
    entrypoint:
      - /bin/sh
      - /scripts/pqc-handshake-tests.sh
